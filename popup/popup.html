<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Message Helper - Setup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>LinkedIn Message Helper</h1>
      <p class="subtitle">Setup &amp; Configuration</p>
    </header>

    <div id="status-banner" class="status-banner hidden">
      <span id="status-icon" class="status-icon"></span>
      <span id="status-text"></span>
    </div>

    <div class="form-group">
      <label for="api-provider">AI Provider</label>
      <select id="api-provider">
        <option value="openai">OpenAI (GPT-4o-mini)</option>
        <option value="anthropic">Anthropic (Claude)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="api-key">API Key</label>
      <input type="password" id="api-key" placeholder="Enter your API key...">
      <p class="hint" id="hint-openai">Get your key from <a href="https://platform.openai.com/api-keys" target="_blank">OpenAI Dashboard</a></p>
      <p class="hint hidden" id="hint-anthropic">Get your key from <a href="https://console.anthropic.com/settings/keys" target="_blank">Anthropic Console</a></p>
    </div>

    <button id="save-btn" class="save-btn">Save Settings</button>

    <div id="save-status" class="save-status hidden"></div>

    <div class="info-box">
      <h2>How to use</h2>
      <p>Navigate to any LinkedIn profile page. A blue chat icon will appear in the bottom-right corner of the page. Click it to generate personalized message suggestions.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

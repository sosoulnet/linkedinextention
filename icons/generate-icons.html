<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<p>Right-click each canvas and "Save image as" to create the icon PNGs.</p>
<div>
  <h3>icon16.png</h3>
  <canvas id="c16" width="16" height="16"></canvas>
</div>
<div>
  <h3>icon48.png</h3>
  <canvas id="c48" width="48" height="48"></canvas>
</div>
<div>
  <h3>icon128.png</h3>
  <canvas id="c128" width="128" height="128"></canvas>
</div>
<script>
function drawIcon(canvasId, size) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const r = size * 0.15;

  // Background rounded rectangle
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#0a66c2';
  ctx.fill();

  // "in" text (LinkedIn style)
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${size * 0.5}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('in', size / 2, size * 0.42);

  // Chat bubble dots
  const dotR = size * 0.04;
  const y = size * 0.75;
  const spacing = size * 0.12;
  ctx.fillStyle = '#ffffff';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(size / 2 + i * spacing, y, dotR, 0, Math.PI * 2);
    ctx.fill();
  }
}

drawIcon('c16', 16);
drawIcon('c48', 48);
drawIcon('c128', 128);
</script>
</body>
</html>
